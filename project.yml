name: Slipstream
options:
  bundleIdPrefix: com.samaydhawan
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  SlipstreamKit:
    path: Packages/SlipstreamKit
settings:
  base:
    SWIFT_VERSION: 6.0
    DEVELOPMENT_TEAM: ZL5U59XBJ6
targets:
  Slipstream:
    type: application
    platform: iOS
    sources:
      - App
      - path: Resources
        buildPhase: resources
        excludes:
          - "AutoFeedback"
          - "AutoFeedback/**"
      # A folder reference keeps AutoFeedback/<family>/ intact in the bundle. The prototype file
      # names repeat across families, so a flattened resource phase would collide.
      - path: Resources/AutoFeedback
        type: folder
        buildPhase: resources
    dependencies:
      - package: SlipstreamKit
        product: SlipstreamDomain
      - package: SlipstreamKit
        product: SlipstreamDesign
      - package: SlipstreamKit
        product: SlipstreamMotion
      - package: SlipstreamKit
        product: SlipstreamAudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samaydhawan.Samadhi
        PRODUCT_NAME: Slipstream
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/Slipstream-Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    preBuildScripts:
      - name: Capture source fingerprint
        script: |
          "$SRCROOT/Scripts/capture-source-fingerprint.sh"
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Embed build identity
        script: |
          "$SRCROOT/Scripts/embed-build-identity.sh"
        inputFiles:
          - "$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)"
          - "$(DERIVED_FILE_DIR)/SlipstreamSourceFingerprint.txt"
        basedOnDependencyAnalysis: false
  SlipstreamTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/SlipstreamTests
    dependencies:
      - target: Slipstream
      - package: SlipstreamKit
        product: SlipstreamDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samaydhawan.SamadhiTests
        GENERATE_INFOPLIST_FILE: YES
  SlipstreamUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/SlipstreamUITests
    dependencies:
      - target: Slipstream
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samaydhawan.SamadhiUITests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Slipstream:
    build:
      targets:
        Slipstream: all
        SlipstreamTests: [test]
        SlipstreamUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SlipstreamTests
        - name: SlipstreamUITests
          parallelizable: true
  Slipstream MusicKit Gate:
    build:
      targets:
        Slipstream: all
    run:
      config: Debug
      commandLineArguments:
        "--music-feasibility": true
  Slipstream Apple Music Core Loop:
    build:
      targets:
        Slipstream: all
    run:
      config: Debug
      commandLineArguments:
        "--apple-music-core-loop": true
  Slipstream Feedback Audition:
    build:
      targets:
        Slipstream: all
    run:
      config: Debug
      commandLineArguments:
        "--feedback-audition": true
